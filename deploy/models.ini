version = 1

; Shared settings (SPEC §3.2).
[*]
; 128k context: browsing piles up page snapshots and screenshots; the agent keeps requests below this.
c = 131072
flash-attn = on
; Work out how many MoE expert layers stay in system RAM so the rest fits in VRAM.
fit = on
jinja = true

; The default model: fast, sees images (screenshots). Apache-2.0. ~22 GB + 0.9 GB vision file.
[qwen3.6-35b]
model = /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /models/Qwen3.6-35B-A3B-mmproj-F16.gguf
; Qwen overthinks simple requests; cap its thinking per step.
reasoning-budget = 1024
load-on-startup = true

; Faster: fits on a 16 GB graphics card with room for the context. Sees images. Apache-2.0. ~8.8 GB + 0.9 GB.
[qwen3.5-9b]
model = /models/Qwen3.5-9B-UD-Q6_K_XL.gguf
mmproj = /models/Qwen3.5-9B-mmproj-F16.gguf
reasoning-budget = 1024

; The default model at 3 bits: nearly all of it fits on a 16 GB card, so it's faster; a little less careful.
[qwen3.6-35b-3bit]
model = /models/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf
mmproj = /models/Qwen3.6-35B-A3B-mmproj-F16.gguf
reasoning-budget = 1024

; Google's Gemma 4 26B-A4B (mixture of experts, 4B active), trained for 4 bits. Sees images. Apache-2.0. ~14.2 GB + 1.2 GB.
[gemma-4-26b]
model = /models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-26B-A4B-mmproj-F16.gguf
reasoning-budget = 1024

; Google's Gemma 4 12B, trained for 4 bits. Sees images. Apache-2.0. ~6.7 GB + 0.2 GB.
[gemma-4-12b]
model = /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-12B-mmproj-F16.gguf
reasoning-budget = 1024
